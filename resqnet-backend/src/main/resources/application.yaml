server:
  port: 8071

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resqnet
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # This helps the driver map the type during auto-creation
        jdbc:
          types:
            geometry: org.hibernate.spatial.JTSGeometryJavaType

  flyway:
    enabled: false