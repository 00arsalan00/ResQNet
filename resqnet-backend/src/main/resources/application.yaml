server:
  port: 8071

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resqnet
    # Falls back to 'postgres' and 'admin' if environment variables are missing
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          types:
            geometry: org.hibernate.spatial.JTSGeometryJavaType

  flyway:
    enabled: false
